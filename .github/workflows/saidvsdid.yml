name: saidvsdid
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 --version || true; python --version || true
        shell: bash
      - uses: JorgeAV99/saidvsdid@6e184a8ff14a5bcc607f4b3440055a56d54435c5 # v0.2.0
        id: sv
        with:
          comment: ${{ matrix.os == 'ubuntu-latest' }}
      - if: always()
        run: echo "verdict=${{ steps.sv.outputs.verdict }} exit=${{ steps.sv.outputs.exit-code }}"
      - if: always()
        shell: bash
        run: cat "$RUNNER_TEMP"/_runner_file_commands/step_summary_* || true
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.14', '3.15']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 --version
      - uses: JorgeAV99/saidvsdid@6e184a8ff14a5bcc607f4b3440055a56d54435c5 # v0.2.0
        id: sv
        with:
          comment: false
      - if: always()
        run: echo "verdict=${{ steps.sv.outputs.verdict }} exit=${{ steps.sv.outputs.exit-code }}"
      - if: always()
        shell: bash
        run: cat "$RUNNER_TEMP"/_runner_file_commands/step_summary_* || true
